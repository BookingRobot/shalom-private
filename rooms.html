<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Улучшить программу</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#F4F1EA;color:#1C2620;font-family:Manrope,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
*{box-sizing:border-box}
a{color:#1F5F4A}a:hover{color:#143F31}
h1,h2,h3{font-family:Lora,Georgia,"Times New Roman",serif;margin:0;line-height:1.2;font-weight:600}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:2px;font-weight:700;font-size:19px;cursor:pointer;text-decoration:none;border:2px solid transparent;white-space:nowrap}
.btn-primary{background:#1F5F4A;color:#fff}.btn-primary:hover{background:#174B3A;color:#fff}
.btn-secondary{background:#fff;color:#1F5F4A;border-color:#1F5F4A}.btn-secondary:hover{background:#EEF5F1;color:#143F31}
.card{background:#fff;border:1px solid #E3DED2;border-radius:2px}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#6B776F}
.step .num{width:36px;height:36px;border-radius:2px;border:2px solid #CFC9BB;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff}
.step.on{color:#1F5F4A}.step.on .num{background:#1F5F4A;border-color:#1F5F4A;color:#fff}
.ico2{display:flex;align-items:center;gap:10px;font-size:15px;color:#1C2620;line-height:1.25}
.ico2 svg{flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:#EEF5F1;color:#1F5F4A;font-weight:800;font-size:14px;padding:5px 12px;border-radius:2px}
.prog{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 18px;border:2px solid #CFC9BB;border-radius:2px;background:#fff;cursor:pointer;text-align:left;flex:1 1 280px}
.prog.on{border-color:#1F5F4A;background:#EEF5F1}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid #CFC9BB;display:flex;align-items:center;justify-content:center;flex:none;background:#fff}
.radio.on{border-color:#1F5F4A}.radio.on i{width:14px;height:14px;border-radius:50%;background:#1F5F4A;display:block}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div style="display:flex;flex-direction:column;min-height:400px">

<header style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:0 24px;min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="main.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1C2620">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" fill="#1F5F4A"></rect><path d="M20 9 L27 21 H23.5 L28 30 H12 L16.5 21 H13 Z" fill="#F4F1EA"></path></svg>
      <span style="font-family:Lora,Georgia,serif;font-size:24px;font-weight:700">Санатории Литвы</span>
    </a>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="font-size:16px;color:#3E4B44">Нужна помощь с заказом?</span>
      <a href="tel:+37060000000" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#1C2620;font-weight:800;font-size:20px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2z"></path></svg>
        +370&nbsp;600 00000
      </a>
    </div>
  </div>
</header>

<!-- Steps -->
<div style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap">
    <div class="step on"><span class="num">1</span>Номер</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step"><span class="num">2</span>Трансфер</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step"><span class="num">3</span>Гости</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step"><span class="num">4</span>Рейсы</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step"><span class="num">5</span>Оплата</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step" style="gap:8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A968F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>Готово</div>
    </div>
</div>

<div style="max-width:1180px;margin:0 auto;padding:28px 24px 40px;width:100%;display:flex;flex-direction:column;gap:20px">
  <div style="font-size:15px;color:#3E4B44"><a href="main.html">Главная</a> › <a href="results.html">Друскининкай</a> › <a href="hotel.html">Эгле Комфорт</a> › Номер и программа</div>

  <div style="display:flex;flex-direction:column;gap:6px">
    <h1 style="font-size:38px">Хотите улучшить программу?</h1>
    <p style="margin:0;font-size:18px;color:#3E4B44">Номер выбран. Самая доступная программа уже включена — если хотите больше процедур или полный пансион, выберите улучшение ниже.</p>
  </div>


  <!-- Chosen room -->
  <section class="card" style="display:flex;flex-wrap:wrap;overflow:hidden">
    <img src="assets/33f9767ee953a7f2d2c8ec5ee6a77798.jpg" alt="Двухместный номер" style="width:220px;height:150px;object-fit:cover;display:block;margin:12px 0 12px 12px;border-radius:2px;flex:none">
    <div style="flex:1 1 300px;padding:14px 20px;display:flex;flex-direction:column;gap:6px;justify-content:center">
      <span style="font-size:13px;font-weight:700;color:#6B776F;text-transform:uppercase;letter-spacing:.04em">Ваш номер</span>
      <strong style="font-family:Lora,Georgia,serif;font-size:24px">Двухместный номер</strong>
      <span style="font-size:16px;color:#3E4B44">Санаторий Эгле Комфорт ★★★★ · 17–18 м² · 2 отдельные кровати · балкон</span>
      <span style="font-size:16px;color:#3E4B44">{{dateRange}} · {{nightsLabel}} · 2 взрослых</span>
    </div>
    <div style="flex:0 0 220px;padding:14px 20px;display:flex;align-items:center;justify-content:flex-end">
      <a class="btn btn-secondary" href="hotel.html" style="min-height:48px;font-size:16px;padding:0 18px">Изменить номер</a>
    </div>
  </section>

  <!-- Programme upgrades -->
  <template data-for="{{progs}}" data-as="p">
    <article class="card" style="display:flex;flex-direction:column;overflow:hidden;border:2px solid {{p.border}}">
      <div style="display:flex;flex-wrap:wrap;align-items:stretch">
        <div style="flex:1 1 560px;min-width:0;padding:18px 22px;display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <svg width="34" height="34" viewBox="-1 -1 26 26" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 20c-2-2-3-5-3-8 0-3 1-6 3-8 2 2 3 5 3 8 0 3-1 6-3 8zM12 20c-4-1-7-4-8-8 3 0 6 2 8 5M12 20c4-1 7-4 8-8-3 0-6 2-8 5M4 20c3 1 5 1 8 0 3 1 5 1 8 0"></path></svg>
            <h2 style="font-size:26px">{{p.name}}</h2>
            <span class="pill">{{p.tag}}</span>
          </div>
          <div style="font-size:16px;color:#3E4B44">{{p.sub}}</div>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px">
            <template data-for="{{p.value}}" data-as="v">
              <div style="background:#EEF5F1;border:1px solid #C8DED3;border-radius:2px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-height:104px">
                <div style="display:flex;align-items:center;gap:8px"><svg width="28" height="28" viewBox="-1 -1 26 26" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="{{v.d}}"></path></svg><span style="font-family:Lora,Georgia,serif;font-size:32px;font-weight:700;line-height:1;color:#1F5F4A">{{v.big}}</span></div>
                <strong style="font-size:15px;line-height:1.2">{{v.label}}</strong>
                <span style="font-size:13px;line-height:1.3;color:#3E4B44">{{v.sub}}</span>
              </div>
            </template>
          </div>
        </div>
        <div style="flex:0 0 260px;padding:18px 20px;margin:14px 0;border-left:1px solid #E3DED2;display:flex;flex-direction:column;gap:4px;justify-content:center">
          <span style="font-size:14px;font-weight:700;color:#3E4B44">{{p.deltaLabel}}</span>
          <span style="font-size:30px;font-weight:800;line-height:1.1;white-space:nowrap;color:{{p.deltaColor}}">{{p.delta}}</span>
          <span style="font-size:15px;margin-top:6px">Итого за заезд:</span>
          <span style="font-size:22px;font-weight:800;white-space:nowrap">{{p.total}}</span>
          <span style="font-size:13px;color:#6B776F">≈ {{p.ppn}} / чел. в сутки</span>
          <button type="button" class="btn {{p.btnCls}}" onClick="{{p.pick}}" style="min-height:50px;font-size:16px;margin-top:10px;padding:0 16px">{{p.btnLabel}}</button>
        </div>
      </div>
      <button type="button" onClick="{{p.toggle}}" style="display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;border-top:1px solid #E3DED2;background:#FAFBF9;padding:12px 20px;min-height:52px;cursor:pointer;font-weight:700;font-size:16px;color:#1F5F4A;text-align:left">
        <span style="display:flex;align-items:center;gap:10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M6 3h9l5 5v13H6zM14 3v6h6M9 13h6M9 17h6"></path></svg>{{p.toggleLabel}}</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:{{p.chev}}"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <template data-if="{{p.open}}">
        <div style="border-top:1px solid #E3DED2;background:#FAFBF9;padding:16px 22px 20px;display:flex;flex-wrap:wrap;gap:18px 32px">
          <div style="flex:1 1 280px;display:flex;flex-direction:column;gap:8px">
            <div style="font-size:13px;font-weight:700;color:#6B776F;text-transform:uppercase;letter-spacing:.04em">В программу входит</div>
            <template data-for="{{p.prog}}" data-as="it"><div class="ico2" style="font-size:16px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>{{it.t}}</div></template>
          </div>
          <div style="flex:2 1 420px;display:flex;flex-direction:column;gap:3px;background:#FAF8F3;border-radius:2px;padding:12px 16px">
            <div style="font-size:13px;font-weight:700;color:#6B776F;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px">Подробно о программе</div>
            <template data-for="{{p.detLines}}" data-as="l"><div style="font-size:15px;line-height:1.45;font-weight:{{l.fw}};padding-left:{{l.pl}};margin-top:{{l.mt}}">{{l.t}}</div></template>
          </div>
        </div>
      </template>
    </article>
  </template>

  <div style="display:flex;align-items:center;gap:12px;font-size:15px;color:#3E4B44"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg>Процедуры назначает врач после консультации. Улучшить программу можно и на месте — по наличию.</div>
</div>

<!-- Sticky summary -->
<div style="position:sticky;bottom:0;background:#fff;border-top:2px solid #1F5F4A;box-shadow:0 -6px 18px rgba(0,0,0,.08);margin-top:auto">
  <div style="max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:15px;color:#3E4B44">{{sumLine}}</span>
      <span style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><strong style="font-size:28px;white-space:nowrap">{{sumTotal}}</strong><span style="font-size:15px;color:#3E4B44">сейчас только аванс <strong style="color:#1C2620;white-space:nowrap">{{sumAdv}}</strong>, остальное при заезде</span></span>
    </div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <a class="btn btn-secondary" href="hotel.html">← К номерам</a>
      <a class="btn btn-primary" href="transfer.html" style="min-height:60px;font-size:20px;padding:0 34px">Далее: трансфер →</a>
    </div>
  </div>
</div>

<footer style="background:#1C2620;color:#D9E2DC">
  <div style="max-width:1180px;margin:0 auto;padding:24px 24px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:16px">
    <div>Санатории Литвы · консультация на русском · WhatsApp +370&nbsp;600 00000</div>
    <div style="display:flex;gap:24px"><a href="rules.html" style="color:#D9E2DC;text-decoration:none">Как оплатить</a><a href="rules.html" style="color:#D9E2DC;text-decoration:none">Условия отмены</a></div>
  </div>
</footer>

</div>


<!-- Sticky help button + support pop-up (same on every page) -->
<button type="button" onClick="{{helpOpenFn}}" aria-haspopup="dialog" style="position:fixed;right:24px;bottom:{{helpBottom}};z-index:40;display:flex;align-items:center;gap:10px;min-height:60px;padding:0 22px 0 16px;border:none;border-radius:30px;background:#1F5F4A;color:#fff;font:700 18px Manrope,'Segoe UI',Arial,sans-serif;cursor:pointer;box-shadow:0 8px 24px rgba(18,34,27,.35)">
  <span style="width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0M4 13v5a2 2 0 0 0 2 2h2v-7H4zM20 13v5a2 2 0 0 1-2 2h-2v-7h4"></path></svg></span>
  Свяжитесь со мной
</button>
<template data-if="{{helpOpen}}">
<div style="position:fixed;inset:0;background:rgba(18,34,27,.55);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;font-family:Manrope,'Segoe UI',Arial,sans-serif;color:#1C2620">
  <div role="dialog" aria-modal="true" aria-labelledby="helpTitle" style="background:#fff;border-radius:2px;width:min(720px,100%);display:flex;flex-direction:column;gap:18px;padding:26px 28px 24px;box-shadow:0 24px 60px rgba(0,0,0,.35)">
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
      <div style="display:flex;gap:14px;align-items:center">
        <span style="width:52px;height:52px;border-radius:50%;background:#EEF5F1;display:flex;align-items:center;justify-content:center;flex:none"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0M4 13v5a2 2 0 0 0 2 2h2v-7H4zM20 13v5a2 2 0 0 1-2 2h-2v-7h4"></path></svg></span>
        <div style="display:flex;flex-direction:column;gap:2px"><h2 id="helpTitle" style="font-family:Lora,Georgia,serif;font-size:28px;font-weight:600;margin:0;line-height:1.2">Свяжитесь со мной</h2><span style="font-size:16px;color:#3E4B44">Ответим на русском в течение 2 часов (9:00–20:00)</span></div>
      </div>
      <button type="button" onClick="{{helpCloseFn}}" aria-label="Закрыть" style="width:48px;height:48px;border:2px solid #CFC9BB;background:#fff;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C2620" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>

    <template data-if="{{helpForm}}">
    <div style="display:flex;flex-direction:column;gap:16px">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px">
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:700;font-size:16px;color:#3E4B44">Имя</span><input type="text" placeholder="Например: Михаил" autocomplete="name" style="min-height:54px;border:2px solid #CFC9BB;border-radius:2px;padding:0 16px;font:500 18px Manrope,sans-serif;width:100%;box-sizing:border-box"></label>
        <label style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:700;font-size:16px;color:#3E4B44">E-mail</span><input type="email" placeholder="name@gmail.com" autocomplete="email" style="min-height:54px;border:2px solid #CFC9BB;border-radius:2px;padding:0 16px;font:500 18px Manrope,sans-serif;width:100%;box-sizing:border-box"></label>
      </div>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:700;font-size:16px;color:#3E4B44">Телефон</span>
        <span style="display:flex;gap:8px"><select aria-label="Код страны" style="min-height:54px;border:2px solid #CFC9BB;border-radius:2px;padding:0 12px;font:700 17px Manrope,sans-serif;background:#fff;flex:none;width:170px"><option>+972 · Израиль</option><option>+370 · Литва</option><option>+1 · США</option><option>+49 · Германия</option><option>+7 · Россия</option><option>+380 · Украина</option></select><input type="tel" inputmode="numeric" placeholder="50 123 4567" autocomplete="tel-national" style="min-height:54px;border:2px solid #CFC9BB;border-radius:2px;padding:0 16px;font:500 18px Manrope,sans-serif;width:100%;box-sizing:border-box"></span>
      </label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:700;font-size:16px;color:#3E4B44">Ваш вопрос</span><textarea rows="3" placeholder="Например: какой санаторий лучше для суставов? Можно ли приехать с внуком?" style="min-height:100px;border:2px solid #CFC9BB;border-radius:2px;padding:12px 16px;font:500 17px Manrope,sans-serif;width:100%;box-sizing:border-box;resize:vertical"></textarea></label>

      <div style="display:flex;flex-direction:column;gap:12px;background:#F7F5F0;border:1px solid #E3DED2;border-radius:2px;padding:14px 16px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap"><strong style="font-size:16px">Если уже знаете — так мы поможем быстрее</strong><span style="font-size:14px;color:#6B776F">не обязательно</span></div>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(190px,100%),1fr));gap:12px">
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:700;font-size:15px;color:#3E4B44">Заезд, примерно</span><input type="date" value="{{helpIn}}" style="min-height:52px;border:2px solid #CFC9BB;border-radius:2px;padding:0 12px;font:600 17px Manrope,sans-serif;width:100%;box-sizing:border-box;background:#fff"></label>
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font-weight:700;font-size:15px;color:#3E4B44">Выезд, примерно</span><input type="date" value="{{helpOut}}" style="min-height:52px;border:2px solid #CFC9BB;border-radius:2px;padding:0 12px;font:600 17px Manrope,sans-serif;width:100%;box-sizing:border-box;background:#fff"></label>
          <label style="display:flex;flex-direction:column;gap:6px;grid-column:1 / -1"><span style="font-weight:700;font-size:15px;color:#3E4B44">Куда хотите поехать</span>
            <select style="min-height:52px;border:2px solid #CFC9BB;border-radius:2px;padding:0 12px;font:600 17px Manrope,sans-serif;width:100%;background:#fff">
              <template data-for="{{helpDests}}" data-as="hd"><option value="{{hd.v}}" selected="{{hd.sel}}">{{hd.t}}</option></template>
            </select>
          </label>
        </div>
        <template data-if="{{helpPrefilled}}"><span style="font-size:14px;color:#1F5F4A;display:flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg>Заполнили по вашему поиску — можно изменить</span></template>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap">
        <span style="font-size:14px;color:#6B776F;max-width:340px">Нужно указать имя и телефон или e-mail. Данные используем только для ответа.</span>
        <button type="button" onClick="{{helpSendFn}}" style="min-height:58px;padding:0 30px;border:none;border-radius:2px;background:#1F5F4A;color:#fff;font:700 19px Manrope,sans-serif;cursor:pointer">Отправить</button>
      </div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid #E3DED2;padding-top:14px;font-size:16px">
        <span style="color:#3E4B44">Или сразу:</span>
        <a href="https://wa.me/37060000000" style="font-weight:700;color:#1F5F4A">WhatsApp</a>
        <a href="tel:+37060000000" style="font-weight:700;color:#1F5F4A;white-space:nowrap">+370&nbsp;600 00000</a>
      </div>
    </div>
    </template>

    <template data-if="{{helpSent}}">
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:6px 0 4px">
      <span style="width:64px;height:64px;border-radius:50%;background:#1F5F4A;display:flex;align-items:center;justify-content:center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></span>
      <strong style="font-family:Lora,Georgia,serif;font-size:26px;font-weight:600">Спасибо! Мы скоро свяжемся с вами</strong>
      <span style="font-size:17px;color:#3E4B44">Консультант ответит в течение 2 часов в рабочее время. Ваш поиск и выбор на этой странице сохранены.</span>
      <button type="button" onClick="{{helpCloseFn}}" style="min-height:54px;padding:0 26px;border:2px solid #1F5F4A;border-radius:2px;background:#fff;color:#1F5F4A;font:700 18px Manrope,sans-serif;cursor:pointer">Вернуться</button>
    </div>
    </template>
  </div>
</div>
</template>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { prog: 'midi', open: {} };
  }
  renderVals() {
    return { ...this._rv(), ...this.helpVals() };
  }
  // ---- Support pop-up: same on every page; dates/destination prefilled from the page when known ----
  helpVals() {
    const st = this.state || {};
    const CTX = { hotel: 'Санаторий Эгле Комфорт, Друскининкай', in: '2026-11-09', out: '2026-11-18', bottom: '120px' };
    const iso = d => d.toISOString().slice(0, 10);
    let hin = st.in || st.checkin || CTX.in || '', hout = st.out || CTX.out || '';
    if (!st.out && st.checkin) { const d = new Date(st.checkin + 'T00:00:00Z'); hout = iso(new Date(d.getTime() + (st.nights || 9) * 86400000)); }
    const DEST = [['', 'Ещё не знаю — подскажите'], ['druskininkai', 'Друскининкай'], ['birstonas', 'Бирштонас'], ['palanga', 'Паланга'], ['anyksciai', 'Аникщяй']];
    if (CTX.hotel) DEST.splice(2, 0, ['hotel', CTX.hotel]);
    const sel = CTX.hotel ? 'hotel' : (CTX.dest || '');
    const hs = st.help || 'closed';
    return {
      helpOpen: hs !== 'closed', helpForm: hs === 'form', helpSent: hs === 'sent',
      helpOpenFn: () => this.setState({ help: 'form' }), helpCloseFn: () => this.setState({ help: 'closed' }), helpSendFn: () => this.setState({ help: 'sent' }),
      helpIn: hin, helpOut: hout, helpPrefilled: !!(hin || sel),
      helpDests: DEST.map(([v, t]) => ({ v, t, sel: v === sel })),
      helpBottom: CTX.bottom || '24px'
    };
  }
  _rv() {
    const I = {
      meals: 'M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 3c-2 0-3 2-3 5v3h3v10M17 3v8',
      doctor: 'M8 4h8v3H8zM6 6h12v15H6zM9 14h2l1-3 2 6 1-3h2',
      proc: 'M12 20c-2-2-3-5-3-8 0-3 1-6 3-8 2 2 3 5 3 8 0 3-1 6-3 8zM12 20c-4-1-7-4-8-8 3 0 6 2 8 5M12 20c4-1 7-4 8-8-3 0-6 2-8 5M4 20c3 1 5 1 8 0 3 1 5 1 8 0',
      pool: 'M3 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0M7 14V6a2 2 0 0 1 4 0M13 14V6a2 2 0 0 1 4 0M7 10h6',
      sauna: 'M8 4c-1 2 1 3 0 5M12 4c-1 2 1 3 0 5M16 4c-1 2 1 3 0 5M4 12h16v8H4zM8 16h8',
      massage: 'M12 20c-4 0-8-3-8-7 2 0 4 1 5 2-1-3 0-7 3-9 3 2 4 6 3 9 1-1 3-2 5-2 0 4-4 7-8 7z',
      gym: 'M2 12h3M19 12h3M5 8v8M8 6v12M16 6v12M19 8v8M8 12h8',
      bed2: 'M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 18h18M5 9V6h6v3M13 9V6h6v3'
    };
    const am = (k, t) => ({ d: I[k], t });
    const st = this.state;
    const NIGHTS = 9, PERS = 2, ADV = 0.04;
    const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    const eur = n => fmt(n) + ' €';
    const ROOM = { name: 'Двухместный номер', add: 0 };
    const base = 'Для взрослого в цену включено:\n— Консультация врача и назначенные процедуры\n— Проживание\n— Трёхразовое питание «шведский стол»\n— Бассейны и сауны без ограничений\n\nДень приезда и отъезда считаются одним лечебным днём. Процедуры назначает врач, по одной из каждой группы:\n1. Лечебная ванна или грязевая аппликация\n2. Лечебный массаж или подводный массаж\n3. Кинезитерапия в зале или в воде\n4. Аппаратная физиотерапия, ингаляции, соляная комната';
    const PROGS = [
      { id: 'midi', name: 'Программа «Миди»', price: 2138, tag: '3 процедуры в день', sub: '3 процедуры в день · питание 3 раза · бассейны и сауны',
        prog: [am('meals', 'Трёхразовое питание'), am('doctor', 'Консультация врача'), am('proc', '3 процедуры в день'), am('pool', 'Бассейны без ограничений'), am('sauna', 'Турецкая и финская бани')], details: base,
        value: [['proc', '3', 'процедуры в день', '27 за весь заезд'], ['meals', '3', 'приёма пищи', 'шведский стол'], ['doctor', '1', 'консультация врача', 'при заезде'], ['pool', '∞', 'бассейны и сауны', 'без ограничений']] },
      { id: 'maxi', name: 'Программа «Макси»', price: 2275, tag: '5 процедур в день', sub: '5 процедур в день · питание 3 раза · бассейны и сауны',
        prog: [am('meals', 'Трёхразовое питание'), am('doctor', 'Консультация врача'), am('proc', '5 процедур в день'), am('pool', 'Бассейны без ограничений'), am('gym', 'Тренажёрный зал')], details: base.replace('по одной из каждой группы', 'по одной из каждой группы, плюс дополнительная ванна и массаж в день'),
        value: [['proc', '5', 'процедур в день', '45 за весь заезд'], ['meals', '3', 'приёма пищи', 'шведский стол'], ['doctor', '1', 'консультация врача', 'при заезде'], ['pool', '∞', 'бассейны и сауны', 'без ограничений']] },
      { id: 'prem', name: 'Программа «Премиум»', price: 2550, tag: '5 процедур + массаж', sub: '5 процедур в день + массаж каждый день · полный пансион',
        prog: [am('meals', 'Полный пансион, диетическое меню'), am('doctor', 'Консультация врача'), am('proc', '5 процедур в день'), am('massage', 'Массаж каждый день, 30 мин'), am('pool', 'Бассейны без ограничений')], details: 'Для взрослого в цену включено:\n— Всё, что в программе «Макси»\n— Ежедневный классический массаж 30 мин\n— Полный пансион: завтрак, обед, полдник, ужин, диетическое меню по назначению врача',
        value: [['proc', '5', 'процедур в день', '45 за весь заезд'], ['massage', '9', 'массажей', 'каждый день по 30 мин'], ['meals', '4', 'приёма пищи', 'полный пансион'], ['doctor', '1', 'консультация врача', 'при заезде']] }
    ];
    const open = st.open || {};
    const sel = PROGS.find(p => p.id === st.prog) || PROGS[0];
    const total = sel.price + ROOM.add;
    return {
      dateRange: '9–18 ноября 2026', nightsLabel: NIGHTS + ' ночей',
      progs: PROGS.map((p, i) => {
        const on = p.id === sel.id, t = p.price + ROOM.add, d = p.price - PROGS[0].price, isO = !!open[p.id];
        return { ...p, value: p.value.map(([k, big, label, sub]) => ({ d: I[k], big, label, sub })),
          detLines: p.details.split('\n').map(l => l.trim()).filter(Boolean).map(l => ({ t: l.replace(/^— ?/, '• '), fw: /:$/.test(l) || /^\d+\./.test(l) ? 700 : 400, pl: /^—/.test(l) ? '14px' : '0', mt: /:$/.test(l) || /^День/.test(l) ? '8px' : '0' })),
          deltaLabel: i === 0 ? 'Уже в цене номера' : 'Улучшение', delta: i === 0 ? 'Включена' : '+' + eur(d), deltaColor: i === 0 ? '#1F5F4A' : '#1C2620',
          total: eur(t), ppn: eur(Math.round(t / NIGHTS / PERS)),
          border: on ? '#1F5F4A' : '#E3DED2', btnCls: on ? 'btn-primary' : 'btn-secondary', btnLabel: on ? '✓ Выбрана' : (i === 0 ? 'Оставить эту' : 'Улучшить до этой'),
          open: isO, chev: isO ? 'rotate(180deg)' : 'none', toggleLabel: isO ? 'Свернуть' : 'Что входит в программу подробно',
          toggle: () => this.setState({ open: { ...open, [p.id]: !isO } }),
          pick: () => this.setState({ prog: p.id }) };
      }),
      sumLine: ROOM.name + ' · ' + sel.name + (sel.price > PROGS[0].price ? ' (+' + eur(sel.price - PROGS[0].price) + ')' : '') + ' · ' + NIGHTS + ' ночей · 2 взрослых',
      sumTotal: eur(total), sumAdv: eur(Math.ceil(total * ADV))
    };
  }
}
DC.mount(Component);
</script>
</body>
</html>
