<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Санаторий Эгле Комфорт — вариант B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#F4F1EA;color:#1C2620;font-family:Manrope,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
*{box-sizing:border-box}
a{color:#1F5F4A}a:hover{color:#143F31}
h1,h2,h3{font-family:Lora,Georgia,"Times New Roman",serif;margin:0;line-height:1.2;font-weight:600}
input,select,button,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:2px;font-weight:700;font-size:19px;cursor:pointer;text-decoration:none;border:2px solid transparent;white-space:nowrap}
.btn-primary{background:#1F5F4A;color:#fff}.btn-primary:hover{background:#174B3A;color:#fff}
.btn-secondary{background:#fff;color:#1F5F4A;border-color:#1F5F4A}.btn-secondary:hover{background:#EEF5F1;color:#143F31}
.card{background:#fff;border:1px solid #E3DED2;border-radius:3px}
.navlink{text-decoration:none;color:#1C2620;font-weight:600;font-size:17px}
.navlink:hover{color:#1F5F4A}
.thumb{padding:0;border:3px solid transparent;border-radius:2px;overflow:hidden;background:#2B3A33;cursor:pointer;min-height:44px}
.thumb img{display:block;width:100%;height:110px;object-fit:cover}
.thumb.on{border-color:#1F5F4A}
.ico{display:flex;align-items:center;gap:10px;font-size:16px;color:#1C2620}
.ico svg{flex:none}
.tab{padding:12px 4px;font-weight:700;font-size:17px;color:#3E4B44;text-decoration:none;border-bottom:3px solid transparent}
.tab.on{color:#1F5F4A;border-bottom-color:#1F5F4A}
.fact{display:flex;gap:10px;align-items:center;font-size:16px;color:#3E4B44}
.acc{background:none;border:none;padding:0;display:flex;align-items:center;gap:8px;color:#1F5F4A;font-weight:700;font-size:16px;cursor:pointer;min-height:44px;text-align:left}
.acc:hover{text-decoration:underline}
.detail{font-size:16px;color:#1C2620;white-space:pre-line;padding:4px 0 8px 32px}
.chk{display:flex;align-items:center;gap:12px;min-height:40px;cursor:pointer;font-size:16px}
.chk input{width:24px;height:24px;accent-color:#1F5F4A;margin:0;flex:none}

.pill{display:inline-flex;align-items:center;background:#EEF5F1;color:#1F5F4A;font-weight:800;font-size:14px;padding:5px 12px;border-radius:2px}
.fact{display:flex;align-items:center;gap:8px;font-size:15px;color:#3E4B44}
.ico2{display:flex;align-items:center;gap:10px;font-size:14px;color:#1C2620;line-height:1.2}
.strip{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:600;color:#1C2620;padding:14px 18px;flex:1 1 220px;justify-content:center}
.strip+.strip{border-left:1px solid #C8DED3}
.accrow{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:#fff;border:1px solid #E3DED2;border-radius:2px;padding:12px 18px;min-height:52px;cursor:pointer;font-weight:600;font-size:16px;text-align:left}
.accrow:hover{border-color:#1F5F4A}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.lbl{font-weight:700;font-size:15px;color:#3E4B44}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;border:2px solid transparent;border-radius:2px;padding:4px 2px;font-weight:700;font-size:21px;line-height:1;cursor:pointer;background:none}
.cell small{font-size:13px;font-weight:600;line-height:1}
.cell:hover{border-color:#1F5F4A}
.wd{font-size:13px;font-weight:700;color:#6B776F;text-align:center;padding:6px 0}
.navbtn{width:48px;height:48px;border:2px solid #CFC9BB;background:#fff;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.navbtn:hover{border-color:#1F5F4A}
.preset{min-height:44px;padding:0 16px;border:2px solid #CFC9BB;background:#fff;border-radius:2px;font-weight:700;font-size:15px;cursor:pointer}
.preset:hover{border-color:#1F5F4A}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;color:#3E4B44}
.lg i{width:18px;height:18px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div style="display:flex;flex-direction:column;min-height:400px">

<header style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:0 24px;min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="main.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1C2620">
      <svg width="38" height="38" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" fill="#1F5F4A"></rect><path d="M20 9 L27 21 H23.5 L28 30 H12 L16.5 21 H13 Z" fill="#F4F1EA"></path></svg>
      <span style="font-family:Lora,Georgia,serif;font-size:23px;font-weight:700">Санатории Литвы</span>
    </a>
    <nav style="display:flex;align-items:center;gap:36px;flex-wrap:wrap">
      <a class="navlink" href="results.html">Курорты</a><a class="navlink" href="rules.html">Как оплатить</a><a class="navlink" href="rules.html">Условия</a><a class="navlink" href="done.html">Контакты</a>
    </nav>
    <a href="tel:+37060000000" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#1C2620;font-weight:800;font-size:19px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2z"></path></svg>+370&nbsp;600 00000</a>
  </div>
</header>

<div style="max-width:1180px;margin:0 auto;padding:18px 24px 56px;width:100%;display:flex;flex-direction:column;gap:18px">
  <div style="font-size:15px;color:#3E4B44"><a href="main.html">Санатории</a> → <a href="results.html">Друскининкай</a> → Эгле Комфорт</div>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><h1 style="font-size:40px">Санаторий Эгле Комфорт</h1><span style="color:#B8860B;font-size:22px;letter-spacing:1px" aria-label="4 звезды">★★★★</span></div>
      <div class="fact" style="font-size:16px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 22s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>Друскининкай · Eglės g. 1 · <a href="hotel.html#reviews">26 отзывов</a></div>
    </div>
    <a class="btn btn-secondary" href="results.html" style="min-height:48px;font-size:16px">← К результатам</a>
  </div>

  <!-- Gallery: ONE row, sizes decreasing left to right; click opens the full gallery -->
  <div style="display:flex;gap:10px;flex-wrap:nowrap;overflow:hidden">
    <button type="button" onClick="{{pick0}}" aria-label="Территория санатория" style="position:relative;padding:0;border:none;background:#2B3A33;border-radius:2px;overflow:hidden;cursor:pointer;height:250px;flex:4 1 0;min-width:0"><img src="assets/1efd1efc34d4137ff98a8658a068afc5.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block"><span style="position:absolute;left:10px;bottom:10px;background:rgba(28,38,32,.8);color:#fff;font-size:13px;font-weight:700;padding:5px 9px;border-radius:2px">Территория</span></button>
    <button type="button" onClick="{{pick2}}" aria-label="Номер" style="position:relative;padding:0;border:none;background:#2B3A33;border-radius:2px;overflow:hidden;cursor:pointer;height:250px;flex:2.2 1 0;min-width:0"><img src="assets/33f9767ee953a7f2d2c8ec5ee6a77798.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block"><span style="position:absolute;left:10px;bottom:10px;background:rgba(28,38,32,.8);color:#fff;font-size:13px;font-weight:700;padding:5px 9px;border-radius:2px">Номер</span></button>
    <button type="button" onClick="{{pick1}}" aria-label="Бассейн" style="position:relative;padding:0;border:none;background:#2B3A33;border-radius:2px;overflow:hidden;cursor:pointer;height:250px;flex:1.5 1 0;min-width:0"><img src="assets/99a77311bc746e38e051bd1146cc0517.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block"><span style="position:absolute;left:10px;bottom:10px;background:rgba(28,38,32,.8);color:#fff;font-size:13px;font-weight:700;padding:5px 9px;border-radius:2px">Бассейн</span></button>
    <button type="button" onClick="{{pickAll}}" aria-label="Все фото" style="position:relative;padding:0;border:none;background:#2B3A33;border-radius:2px;overflow:hidden;cursor:pointer;height:250px;flex:1 1 0;min-width:0"><img src="assets/d4cc2009f5e9b68736ab9f9a044668e5.jpg" alt="" style="width:100%;height:100%;object-fit:cover;display:block"><span style="position:absolute;left:10px;bottom:10px;background:rgba(28,38,32,.8);color:#fff;font-size:13px;font-weight:700;padding:5px 9px;border-radius:2px"></span><span style="position:absolute;inset:0;background:rgba(28,38,32,.55);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:16px;text-align:center;padding:8px;line-height:1.2">Все {{photoCount}} фото →</span></button>
  </div>

  <!-- Full gallery overlay: all photos large, scrollable -->
  <template data-if="{{lightbox}}">
    <div style="position:fixed;inset:0;z-index:50;background:rgba(20,28,24,.96);overflow:auto;display:flex;flex-direction:column">
      <div style="position:sticky;top:0;background:rgba(20,28,24,.96);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px;border-bottom:1px solid rgba(255,255,255,.12)">
        <div style="color:#fff;font-family:Lora,Georgia,serif;font-size:20px;font-weight:600">Санаторий Эгле Комфорт — все фото ({{photoCount}})</div>
        <button type="button" onClick="{{closeLb}}" style="min-height:44px;padding:0 16px;border:none;background:#fff;color:#1C2620;font-weight:800;font-size:16px;cursor:pointer;border-radius:2px">Закрыть ✕</button>
      </div>
      <div style="max-width:1100px;margin:0 auto;padding:20px 24px 60px;width:100%;display:flex;flex-direction:column;gap:18px">
        <template data-for="{{allPhotos}}" data-as="p">
          <figure style="margin:0;display:flex;flex-direction:column;gap:8px">
            <img src="{{p.src}}" alt="{{p.alt}}" style="width:100%;height:auto;max-height:680px;object-fit:cover;display:block;border-radius:2px">
            <figcaption style="color:#D9E2DC;font-size:15px">{{p.n}}. {{p.alt}}</figcaption>
          </figure>
        </template>
      </div>
    </div>
  </template>

  <!-- Key facts strip -->
  <div style="display:flex;flex-wrap:wrap;background:#EEF5F1;border:1px solid #C8DED3;border-radius:2px">
    <div class="strip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M4 3h16v18H4zM12 3v18M8 10V7M16 10V7M8 14v3M16 14v3"></path></svg>Всё в одном здании</div>
    <div class="strip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2M12 15v4M10 17h4"></path></svg>Врач говорит по-русски</div>
    <div class="strip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 3c-2 0-3 2-3 5v3h3v10M17 3v8"></path></svg>Питание 3 раза в день</div>
    <div class="strip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M3 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0M7 14V6a2 2 0 0 1 4 0M13 14V6a2 2 0 0 1 4 0M7 10h6"></path></svg>Бассейн и сауны</div>
  </div>

  <nav style="display:flex;gap:30px;border-bottom:1px solid #E3DED2;flex-wrap:wrap">
    <a class="tab on" href="hotel.html#rooms">Номера и программы</a><a class="tab" href="hotel.html#treat">Лечение</a><a class="tab" href="hotel.html#food">Питание</a><a class="tab" href="hotel.html#about">О санатории</a><a class="tab" href="hotel.html#reviews">Отзывы (26)</a>
  </nav>

  <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:start">
    <div style="flex:1 1 100%;min-width:0;display:flex;flex-direction:column;gap:16px">
      <div style="background:#EEF5F1;border:2px solid #1F5F4A;border-radius:2px;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M3 5h18v16H3zM16 3v4M8 3v4M3 10h18"></path></svg>
          <div style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:700;color:#3E4B44;text-transform:uppercase;letter-spacing:.04em">Ваши даты</span><strong style="font-family:Lora,Georgia,serif;font-size:24px;line-height:1.15">{{dateRange}}</strong></div>
          <span style="font-size:17px;color:#1C2620;padding-left:14px;border-left:1px solid #C8DED3">{{nightsLabel}} · 2 взрослых</span>
        </div>
        <button type="button" class="btn btn-secondary" onClick="{{openCal}}" style="min-height:50px;font-size:16px;padding:0 20px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v16H3zM16 3v4M8 3v4M3 10h18"></path></svg>Изменить даты · когда дешевле?</button>
      </div>

      <div id="rooms" style="display:flex;flex-direction:column;gap:4px;padding-top:6px">
        <h2 style="font-size:32px">Выберите номер</h2>
        <div style="font-size:16px;color:#3E4B44">Цена за весь заезд для двух гостей — с самой доступной программой. Программу можно улучшить внутри карточки номера.</div>
      </div>

      <template data-for="{{offers}}" data-as="o">
      <article class="card" style="display:flex;flex-direction:column;overflow:hidden;border:{{o.cardBorder}};background:{{o.cardBg}}">
        <div style="display:flex;flex-wrap:wrap">
          <div style="position:relative;flex:0 0 300px;min-height:210px;margin:14px 0 14px 14px;border-radius:2px;overflow:hidden;background:#2B3A33">
            <img src="{{o.img}}" alt="{{o.room}}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:{{o.imgFilter}}">
            <template data-if="{{o.busy}}"><span style="position:absolute;left:10px;top:10px;background:#5E6862;color:#fff;font-size:13px;font-weight:800;padding:5px 10px;border-radius:2px">Занят на ваши даты</span></template>
            <span style="position:absolute;left:10px;bottom:10px;background:rgba(28,38,32,.8);color:#fff;font-size:12px;font-weight:700;padding:5px 9px;border-radius:2px">Фото номера</span>
          </div>
          <div style="flex:1 1 300px;min-width:0;padding:16px 20px;display:flex;flex-direction:column;gap:8px">
            <span class="pill" style="align-self:flex-start;background:{{o.pillBg}};color:{{o.pillColor}}">{{o.pill}}</span>
            <h3 style="font-size:24px;color:{{o.nameColor}}">{{o.short}}</h3>
            <div style="font-size:15px;color:#3E4B44">{{o.roomLine}}</div>
            <div style="font-size:15px;color:#3E4B44;margin-top:-4px">{{o.progLine}}</div>
            <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 18px;margin-top:8px">
              <div class="ico2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21v-2a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v2M12 15v4M10 17h4"></path></svg>Консультация<br>врача</div>
              <div class="ico2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 3c-2 0-3 2-3 5v3h3v10M17 3v8"></path></svg>Питание<br>3 раза в день</div>
              <div class="ico2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M3 16c2-2 4-2 6 0s4 2 6 0 4-2 6 0M3 20c2-2 4-2 6 0s4 2 6 0 4-2 6 0M7 14V6a2 2 0 0 1 4 0M13 14V6a2 2 0 0 1 4 0M7 10h6"></path></svg>Бассейн и сауны</div>
              <div class="ico2"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M12 20c-2-2-3-5-3-8 0-3 1-6 3-8 2 2 3 5 3 8 0 3-1 6-3 8zM12 20c-4-1-7-4-8-8 3 0 6 2 8 5M12 20c4-1 7-4 8-8-3 0-6 2-8 5M4 20c3 1 5 1 8 0 3 1 5 1 8 0"></path></svg>Процедуры<br>ежедневно</div>
            </div>
          </div>
          <div style="flex:0 0 240px;padding:18px 20px;display:flex;flex-direction:column;gap:2px;border-left:1px solid #E3DED2;justify-content:center">
<template data-if="{{o.avail}}">
            <span style="font-size:32px;font-weight:800;line-height:1.1;white-space:nowrap"><span style="font-size:18px;font-weight:600">от</span> {{o.price}}&nbsp;€</span>
            <span style="font-size:14px;color:#3E4B44">за 2 взрослых · {{nightsLabel}}</span>
            <span style="font-size:13px;color:#6B776F">≈ {{o.ppn}}&nbsp;€ / человек / сутки · сейчас {{o.adv}}&nbsp;€</span>
            <a class="btn btn-primary" href="rooms.html" style="min-height:48px;font-size:16px;margin-top:12px">Выбрать номер</a>
            </template>
            <template data-if="{{o.busy}}">
            <span style="font-size:18px;font-weight:800;color:#3E4B44;line-height:1.25">Занят на {{o.busyRange}}</span>
            <span style="font-size:15px;color:#3E4B44;margin-top:4px">Свободен: <strong style="color:#1C2620">{{o.nextFree}}</strong></span>
            <button type="button" class="btn btn-secondary" onClick="{{o.openRoomCal}}" style="min-height:48px;font-size:16px;margin-top:12px;padding:0 14px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v16H3zM16 3v4M8 3v4M3 10h18"></path></svg>Выбрать другие даты</button>
            </template>
