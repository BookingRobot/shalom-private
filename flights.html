<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Проверка рейсов</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#F4F1EA;color:#1C2620;font-family:Manrope,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
*{box-sizing:border-box}
a{color:#1F5F4A}a:hover{color:#143F31}
h1,h2,h3{font-family:Lora,Georgia,"Times New Roman",serif;margin:0;line-height:1.2;font-weight:600}
input,select,button,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:2px;font-weight:700;font-size:18px;cursor:pointer;text-decoration:none;border:2px solid transparent;white-space:nowrap}
.btn-primary{background:#1F5F4A;color:#fff}.btn-primary:hover{background:#174B3A;color:#fff}
.btn-secondary{background:#fff;color:#1F5F4A;border-color:#1F5F4A}.btn-secondary:hover{background:#EEF5F1;color:#143F31}
.card{background:#fff;border:1px solid #E3DED2;border-radius:2px}
.input{min-height:54px;border:2px solid #CFC9BB;border-radius:2px;padding:0 16px;background:#fff;font-size:18px;width:100%;appearance:none;-webkit-appearance:none}
.input:focus{outline:3px solid #9CC9B5;border-color:#1F5F4A}
.lbl{font-weight:700;font-size:16px;color:#3E4B44}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#6B776F}
.step .num{width:36px;height:36px;border-radius:2px;border:2px solid #CFC9BB;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff}
.step.on{color:#1F5F4A}.step.on .num{background:#1F5F4A;border-color:#1F5F4A;color:#fff}
.step.done{color:#1C2620}.step.done .num{background:#EEF5F1;border-color:#1F5F4A;color:#1F5F4A}
.opt{flex:1 1 360px;display:flex;flex-direction:column;gap:12px;padding:24px 24px 22px;border:2px solid #CFC9BB;border-radius:2px;background:#fff}
.opt.on{border-color:#1F5F4A;background:#EEF5F1}
.seg{min-height:52px;padding:0 18px;border:2px solid #CFC9BB;background:#fff;border-radius:2px;font-weight:700;font-size:16px;cursor:pointer}
.seg.on{border-color:#1F5F4A;background:#EEF5F1;color:#1F5F4A}
.lang{min-height:36px;padding:0 10px;border:1px solid #CFC9BB;background:#fff;border-radius:2px;font-weight:800;font-size:13px;cursor:pointer}
.lang.on{background:#1C2620;color:#fff;border-color:#1C2620}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:76px;border:2px solid transparent;border-radius:2px;padding:4px 2px;font-weight:700;font-size:21px;line-height:1;cursor:pointer;background:none}
.cell small{font-size:13px;font-weight:600;line-height:1}
.cell:hover{border-color:#1F5F4A}
.wd{font-size:13px;font-weight:700;color:#6B776F;text-align:center;padding:6px 0}
.navbtn{width:48px;height:48px;border:2px solid #CFC9BB;background:#fff;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;color:#3E4B44}
.lg i{width:18px;height:18px;border-radius:2px;display:inline-block}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div dir="{{dir}}" style="display:flex;flex-direction:column;min-height:400px">

<header style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:0 24px;min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="main.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1C2620">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" fill="#1F5F4A"></rect><path d="M20 9 L27 21 H23.5 L28 30 H12 L16.5 21 H13 Z" fill="#F4F1EA"></path></svg>
      <span style="font-family:Lora,Georgia,serif;font-size:24px;font-weight:700">{{t.brand}}</span>
    </a>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="display:flex;gap:4px" aria-label="Язык / Language"><template data-for="{{langs}}" data-as="l"><button type="button" class="lang {{l.cls}}" onClick="{{l.pick}}">{{l.t}}</button></template></span>
      <a href="tel:+37060000000" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#1C2620;font-weight:800;font-size:20px" dir="ltr">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2z"></path></svg>
        +370&nbsp;600 00000
      </a>
    </div>
  </div>
</header>

<div style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap">
    <div class="step done"><span class="num">✓</span>{{t.sRoom}}</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step done"><span class="num">✓</span>{{t.sTransfer}}</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step done"><span class="num">✓</span>{{t.sGuests}}</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step on"><span class="num">4</span>{{t.sFlights}}</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step"><span class="num">5</span>{{t.sPay}}</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step" style="gap:8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A968F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>{{t.sDone}}</div>
    </div>
</div>

<div style="max-width:1180px;margin:0 auto;padding:32px 24px 56px;width:100%;display:flex;flex-direction:column;gap:22px">

  <!-- Prototype-only switch between the two cases -->
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;color:#6B776F">
    <span style="font-weight:700">[Прототип] Показать вариант:</span>
    <template data-for="{{demo}}" data-as="d"><button type="button" class="lang {{d.cls}}" onClick="{{d.pick}}" style="font-size:13px">{{d.t}}</button></template>
  </div>

  <!-- Dates match the partner airline: offer the flights -->
  <template data-if="{{showOffer}}">
  <section style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
    <div style="width:72px;height:72px;border-radius:50%;background:#1F5F4A;display:flex;align-items:center;justify-content:center;flex:none"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20M3.5 15.5l16-5.5a2 2 0 0 0-1.3-3.8l-4.7 1.6L7 4 5 4.7l3.8 4.7-3.6 1.2L3 9l-1.5.5z"></path></svg></div>
    <div style="flex:1 1 520px;display:flex;flex-direction:column;gap:8px">
      <h1 style="font-size:34px">{{t.offTitle}}</h1>
      <p style="margin:0;font-size:19px">{{t.offLead}}</p>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:14px">
    <h2 style="font-size:30px">{{t.qTitle}}</h2>
    <p style="margin:0;font-size:17px;color:#3E4B44">{{t.qLead}}</p>
    <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:stretch">
      <div class="opt {{yesCls}}" style="flex:3 1 440px;background:#1F5F4A;border-color:#1F5F4A;color:#fff;box-shadow:0 10px 26px rgba(31,95,74,.28);position:relative">
        <span style="position:absolute;top:-14px;left:22px;background:#C9893A;color:#fff;font-size:13px;font-weight:800;padding:5px 12px;border-radius:2px;letter-spacing:.02em">{{t.recBadge}}</span>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px"><div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20M3.5 15.5l16-5.5a2 2 0 0 0-1.3-3.8l-4.7 1.6L7 4 5 4.7l3.8 4.7-3.6 1.2L3 9l-1.5.5z"></path></svg></div><span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.15"><strong style="font-size:30px;white-space:nowrap">+{{fTotal}}</strong><span style="font-size:14px;color:#D9E2DC">{{t.forTwo}}</span></span></div>
        <h3 style="font-size:28px;color:#fff">{{t.yTitle}}</h3>
        <p style="margin:0;font-size:17px;color:#E6F0EA;flex:1">{{yText}}</p>
        <button type="button" onClick="{{pickYes}}" style="min-height:64px;font:800 20px Manrope,sans-serif;width:100%;border:none;border-radius:2px;background:#fff;color:#1F5F4A;cursor:pointer">{{yesLabel}}</button>
      </div>
      <div class="opt {{noCls}}" style="flex:2 1 300px;padding:20px 22px">
        <div style="width:56px;height:56px;border-radius:50%;background:#EEF5F1;border:2px solid #1F5F4A;display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v10H3zM15 7v10M7 11h4M7 14h3"></path></svg></div>
        <h3 style="font-size:21px">{{t.nTitle}}</h3>
        <p style="margin:0;font-size:16px;color:#3E4B44;flex:1">{{t.nText}}</p>
        <button type="button" class="btn {{noBtn}}" onClick="{{pickNo}}" style="min-height:54px;font-size:17px;width:100%">{{noLabel}}</button>
      </div>
    </div>
    <template data-if="{{decided}}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#EEF5F1;border:2px solid #1F5F4A;border-radius:2px;padding:16px 20px">
        <span style="font-size:17px">{{decisionLine}}</span>
        <a class="btn btn-primary" href="payment.html" style="min-height:58px;font-size:19px">{{t.toPay}} →</a>
      </div>
    </template>
    <span style="font-size:14px;color:#6B776F">{{t.offNote}}</span>
  </section>
  <section class="card" style="overflow:hidden">
    <div style="padding:14px 22px 0;font-size:13px;font-weight:700;color:#6B776F;text-transform:uppercase;letter-spacing:.04em">{{t.detailsHead}}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 22px;background:#F7F5F0;border-bottom:1px solid #E3DED2">
      <span style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:#1F5F4A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m8 12 3 3 5-6"></path></svg>{{t.offFlights}}</span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;line-height:1.2"><strong style="font-size:30px;color:#1C2620;white-space:nowrap">{{fPpp}}</strong><span style="font-size:14px;color:#3E4B44">{{t.offPpp}}</span></span>
    </div>
    <template data-for="{{legs}}" data-as="g">
      <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:20px 22px;border-bottom:1px dashed #E3DED2">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;flex:none">
          <span style="width:52px;height:52px;border-radius:50%;background:{{g.iconBg}};display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{g.icon}}"></path></svg></span>
          <span style="font-size:13px;font-weight:800;color:#3E4B44;text-transform:uppercase;letter-spacing:.04em">{{g.dir}}</span>
        </div>
        <div style="flex:1 1 520px;display:flex;align-items:center;gap:14px" dir="ltr">
          <div style="display:flex;flex-direction:column;align-items:center;min-width:110px"><strong style="font-size:30px;line-height:1">{{g.from}}</strong><span style="font-size:22px;font-weight:800;color:#1F5F4A">{{g.dep}}</span><span style="font-size:15px;color:#3E4B44">{{g.date}}</span><span style="font-size:13px;color:#6B776F">{{g.fromCity}}</span></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:120px">
            <div style="width:100%;display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:#CFC9BB"></span><span style="flex:1;height:2px;background:#E3DED2"></span><svg width="22" height="22" viewBox="0 0 24 24" fill="#1F5F4A" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z" transform="rotate(90 12 12)"></path></svg><span style="flex:1;height:2px;background:#E3DED2"></span><span style="width:8px;height:8px;border-radius:50%;background:#CFC9BB"></span></div>
            <span style="font-size:16px;color:#3E4B44">{{g.dur}} · {{t.offDirect}}</span>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;min-width:110px"><strong style="font-size:30px;line-height:1">{{g.to}}</strong><span style="font-size:22px;font-weight:800;color:#1F5F4A">{{g.arr}}</span><span style="font-size:15px;color:#3E4B44">{{g.date}}</span><span style="font-size:13px;color:#6B776F">{{g.toCity}}</span></div>
        </div>
        <div style="flex:0 0 220px;display:flex;flex-direction:column;gap:6px">
          <span style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:#1F5F4A" dir="ltr">✈ {{g.no}}</span>
          <span style="display:flex;gap:6px;flex-wrap:wrap"><span style="background:#FFF6E3;color:#8A5A00;font-weight:800;font-size:12px;padding:4px 8px;border-radius:2px">{{t.offCharter}}</span><span style="background:#EEF5F1;color:#1F5F4A;font-weight:800;font-size:12px;padding:4px 8px;border-radius:2px">{{g.seats}}</span></span>
          <span style="font-size:14px;color:#3E4B44">{{g.plane}}</span>
        </div>
      </div>
    </template>
    <div style="display:flex;gap:22px;flex-wrap:wrap;padding:14px 22px;font-size:15px;color:#3E4B44;background:#FAFBF9">
      <span>🧳 {{t.offHand}}</span><span>🛄 {{t.offBag}}</span><span>🍽 {{t.offMeal}}</span><span>✈ {{t.offAirline}}</span>
    </div>
  </section>
  </template>

  <!-- Main notice: friendly, not an error -->
  <template data-if="{{showNotice}}">
  <!-- dates mismatch -->
  <section style="background:#fff;border:1px solid #E3DED2;border-radius:2px;padding:28px 30px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap">
    <div style="width:84px;height:84px;border-radius:50%;background:#EEF5F1;display:flex;align-items:center;justify-content:center;flex:none">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 20h20M3.5 15.5l16-5.5a2 2 0 0 0-1.3-3.8l-4.7 1.6L7 4 5 4.7l3.8 4.7-3.6 1.2L3 9l-1.5.5z"></path></svg>
    </div>
    <div style="flex:1 1 520px;display:flex;flex-direction:column;gap:12px">
      <h1 style="font-size:34px">{{t.title}}</h1>
      <p style="margin:0;font-size:19px;color:#1C2620">{{t.lead}}</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:4px">
        <template data-for="{{dateChips}}" data-as="d">
          <span style="display:inline-flex;align-items:center;gap:8px;background:{{d.bg}};border:1px solid {{d.bd}};border-radius:2px;padding:8px 12px;font-size:16px"><strong>{{d.label}}</strong> {{d.date}} · <span style="color:{{d.color}};font-weight:700">{{d.state}}</span></span>
        </template>
      </div>
      <div style="font-size:15px;color:#3E4B44">{{flightDaysLine}}</div>
    </div>
  </section>

  <!-- Two big equal options -->
  <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:stretch">
    <div class="opt">
      <div style="width:60px;height:60px;border-radius:50%;background:#1F5F4A;display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5L20 7"></path></svg></div>
      <h2 style="font-size:26px">{{t.aTitle}}</h2>
      <p style="margin:0;font-size:17px;color:#3E4B44;flex:1">{{t.aText}}</p>
      <a class="btn btn-primary" href="payment.html" style="min-height:60px;font-size:19px;margin-top:6px">{{t.aBtn}} →</a>
    </div>
    <div class="opt {{bCls}}">
      <div style="width:60px;height:60px;border-radius:50%;background:#EEF5F1;border:2px solid #1F5F4A;display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13a8 8 0 0 1 16 0M4 13v5a2 2 0 0 0 2 2h2v-7H4zM20 13v5a2 2 0 0 1-2 2h-2v-7h4"></path></svg></div>
      <h2 style="font-size:26px">{{t.bTitle}}</h2>
      <p style="margin:0;font-size:17px;color:#3E4B44;flex:1">{{t.bText}}</p>
      <template data-if="{{bIdle}}"><button type="button" class="btn btn-secondary" onClick="{{openB}}" style="min-height:60px;font-size:19px;margin-top:6px;width:100%">{{t.bBtn}}</button></template>
    </div>
  </div>
  </template>

  <!-- B: contact request form (inline, keeps the booking) -->
  <template data-if="{{bForm}}">
  <section class="card" style="padding:24px 26px;display:flex;flex-direction:column;gap:18px;border:2px solid #1F5F4A">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <h2 style="font-size:26px">{{t.fTitle}}</h2>
      <button type="button" onClick="{{closeB}}" style="background:none;border:none;color:#1F5F4A;font-weight:700;font-size:16px;cursor:pointer;min-height:40px">{{t.fCancel}}</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:16px">
      <label style="display:flex;flex-direction:column;gap:6px"><span class="lbl">{{t.fName}}</span><input class="input" type="text" value="Mikhail Levin"></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span class="lbl">{{t.fPhone}}</span><input class="input" type="tel" value="+972 50 123 4567" dir="ltr"></label>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">{{t.fHow}}</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><template data-for="{{channels}}" data-as="c"><button type="button" class="seg {{c.cls}}" onClick="{{c.pick}}">{{c.t}}</button></template></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="lbl">{{t.fWhen}}</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><template data-for="{{times}}" data-as="c"><button type="button" class="seg {{c.cls}}" onClick="{{c.pick}}">{{c.t}}</button></template></div>
    </div>
    <label style="display:flex;flex-direction:column;gap:6px"><span class="lbl">{{t.fNote}}</span><textarea class="input" rows="2" placeholder="{{t.fNotePh}}" style="padding:12px 16px;min-height:80px;resize:vertical"></textarea></label>
