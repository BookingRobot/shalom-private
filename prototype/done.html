<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    return { ...this._rv(), ...this.helpVals() };
  }
  // ---- Support pop-up: same on every page; dates/destination prefilled from the page when known ----
  helpVals() {
    const st = this.state || {};
    const CTX = { hotel: 'Санаторий Эгле Комфорт, Друскининкай', in: '2026-11-09', out: '2026-11-18' };
    const iso = d => d.toISOString().slice(0, 10);
    let hin = st.in || st.checkin || CTX.in || '', hout = st.out || CTX.out || '';
    if (!st.out && st.checkin) { const d = new Date(st.checkin + 'T00:00:00Z'); hout = iso(new Date(d.getTime() + (st.nights || 9) * 86400000)); }
    const DEST = [['', 'Ещё не знаю — подскажите'], ['druskininkai', 'Друскининкай'], ['birstonas', 'Бирштонас'], ['palanga', 'Паланга'], ['anyksciai', 'Аникщяй']];
    if (CTX.hotel) DEST.splice(2, 0, ['hotel', CTX.hotel]);
    const sel = CTX.hotel ? 'hotel' : (CTX.dest || '');
    const hs = st.help || 'closed';
    return {
      helpOpen: hs !== 'closed', helpForm: hs === 'form', helpSent: hs === 'sent',
      helpOpenFn: () => this.setState({ help: 'form' }), helpCloseFn: () => this.setState({ help: 'closed' }), helpSendFn: () => this.setState({ help: 'sent' }),
      helpIn: hin, helpOut: hout, helpPrefilled: !!(hin || sel),
      helpDests: DEST.map(([v, t]) => ({ v, t, sel: v === sel })),
      helpBottom: CTX.bottom || '24px'
    };
  }
  _rv() {
    return {};
  }
}
DC.mount(Component);
</script>
