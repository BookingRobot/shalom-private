<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Шаг 3 из 3 — оплата</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;background:#F4F1EA;color:#1C2620;font-family:Manrope,"Segoe UI",Arial,sans-serif;font-size:18px;line-height:1.5}
*{box-sizing:border-box}
a{color:#1F5F4A}a:hover{color:#143F31}
h1,h2,h3{font-family:Lora,Georgia,"Times New Roman",serif;margin:0;line-height:1.2;font-weight:600}
input,select,button,textarea{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 28px;border-radius:2px;font-weight:700;font-size:19px;cursor:pointer;text-decoration:none;border:2px solid transparent;white-space:nowrap}
.btn-primary{background:#1F5F4A;color:#fff}.btn-primary:hover{background:#174B3A;color:#fff}
.btn-secondary{background:#fff;color:#1F5F4A;border-color:#1F5F4A}.btn-secondary:hover{background:#EEF5F1;color:#143F31}
.input{min-height:56px;border:2px solid #CFC9BB;border-radius:2px;padding:0 16px;background:#fff;font-size:18px;width:100%;appearance:none;-webkit-appearance:none}
.input:focus{outline:3px solid #9CC9B5;border-color:#1F5F4A}
.input::placeholder{color:#8A968F}
.lbl{font-weight:700;font-size:16px;color:#3E4B44}
.hint{font-size:15px;color:#6B776F}
.card{background:#fff;border:1px solid #E3DED2;border-radius:3px}
.choice{display:flex;align-items:flex-start;gap:16px;padding:18px 20px;border:2px solid #CFC9BB;border-radius:3px;background:#fff;cursor:pointer;text-align:left;width:100%;min-height:64px;font-size:18px}
.choice:hover{border-color:#1F5F4A}
.choice.on{border-color:#1F5F4A;background:#EEF5F1;box-shadow:inset 0 0 0 1px #1F5F4A}
.radio{width:28px;height:28px;border-radius:2px;border:2px solid #8A968F;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;margin-top:2px}
.radio.on{border-color:#1F5F4A}
.radio.on i{display:block;width:14px;height:14px;border-radius:2px;background:#1F5F4A}
.step{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:#6B776F}
.step .num{width:36px;height:36px;border-radius:2px;border:2px solid #CFC9BB;display:flex;align-items:center;justify-content:center;font-weight:800;background:#fff}
.step.on{color:#1F5F4A}.step.on .num{background:#1F5F4A;border-color:#1F5F4A;color:#fff}
.step.done{color:#1C2620}.step.done .num{background:#EEF5F1;border-color:#1F5F4A;color:#1F5F4A}
.chk{display:flex;align-items:flex-start;gap:14px;cursor:pointer;font-size:17px}
.chk input{width:26px;height:26px;accent-color:#1F5F4A;margin:2px 0 0;flex:none}
.rule{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.rule b{white-space:nowrap;min-width:150px}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-tpl">


<div style="display:flex;flex-direction:column;min-height:400px">

<header style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:0 24px;min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
    <a href="main.html" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:#1C2620">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="1" y="1" width="38" height="38" fill="#1F5F4A"></rect><path d="M20 9 L27 21 H23.5 L28 30 H12 L16.5 21 H13 Z" fill="#F4F1EA"></path></svg>
      <span style="font-family:Lora,Georgia,serif;font-size:24px;font-weight:700">Санатории Литвы</span>
    </a>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <span style="display:flex;align-items:center;gap:8px;font-size:16px;color:#3E4B44"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Защищённая оплата</span>
      <a href="tel:+37060000000" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#1C2620;font-weight:800;font-size:20px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2z"></path></svg>
        +370&nbsp;600 00000
      </a>
    </div>
  </div>
</header>

<div style="background:#fff;border-bottom:1px solid #E3DED2">
  <div style="max-width:1180px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap">
    <div class="step done"><span class="num">✓</span>Номер</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step done"><span class="num">✓</span>Трансфер</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step done"><span class="num">✓</span>Гости</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step done"><span class="num">✓</span>Рейсы</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step on"><span class="num">5</span>Оплата</div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#CFC9BB" stroke-width="2.5" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
    <div class="step" style="gap:8px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A968F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg>Готово</div>
    </div>
</div>

<div style="max-width:1180px;margin:0 auto;padding:32px 24px 56px;width:100%;display:flex;flex-wrap:wrap;gap:24px;align-items:start">

  <form action="done.html" style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:24px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="font-size:36px">Как вам удобнее оплатить?</h1>
      <p style="margin:0;color:#3E4B44;font-size:18px">Заказ подтверждается после оплаты. Санаторий бронирует номер за вами сразу.</p>
    </div>

    <!-- Plan -->
    <section class="card" style="padding:26px 28px;display:flex;flex-direction:column;gap:16px">
      <h2 style="font-size:24px">Сумма к оплате сейчас</h2>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px">
        <button type="button" class="choice {{advCls}}" onClick="{{pickAdv}}">
          <span class="radio {{advCls}}"><i></i></span>
          <span style="display:flex;flex-direction:column;gap:6px">
            <strong style="font-size:22px;line-height:1.2">Минимальный аванс — <span style="white-space:nowrap">{{advAmt}}&nbsp;€</span></strong>
            <span style="font-size:15px;color:#3E4B44;margin-top:-4px">4&nbsp;% от стоимости бронирования</span>
            <span style="color:#3E4B44;font-size:16px">Этого достаточно, чтобы санаторий подтвердил бронь. Остальные <strong style="color:#1C2620;white-space:nowrap">{{restAmt}}&nbsp;€</strong> оплатите при заезде: наличными, картой или переводом.</span>
            <span style="display:inline-flex;align-self:flex-start;background:#FFF1D6;color:#8A5A00;font-size:14px;font-weight:800;padding:4px 10px;border-radius:2px">Так платят 9 из 10 гостей</span>
          </span>
        </button>
        <button type="button" class="choice {{fullCls}}" onClick="{{pickFull}}">
          <span class="radio {{fullCls}}"><i></i></span>
          <span style="display:flex;flex-direction:column;gap:6px">
            <strong style="font-size:22px;line-height:1.2">Вся сумма — <span style="white-space:nowrap">{{totalAmt}}&nbsp;€</span></strong>
            <span style="color:#3E4B44;font-size:16px">Ничего не платить на месте. Удобно, если оплачивают родственники или организация.</span>
          </span>
        </button>
      </div>
      <div style="display:flex;gap:12px;align-items:start;padding:14px 16px;border-radius:2px;background:#F4F1EA;font-size:16px;color:#3E4B44">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
        <span>{{schedule}}</span>
      </div>
    </section>

    <!-- Method -->
    <section class="card" style="padding:26px 28px;display:flex;flex-direction:column;gap:18px">
      <h2 style="font-size:24px">Способ оплаты</h2>
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <button type="button" class="choice {{cardCls}}" onClick="{{pickCard}}" style="flex:1 1 260px;align-items:center">
          <span class="radio {{cardCls}}" style="margin:0"><i></i></span>
          <span style="display:flex;align-items:center;gap:12px"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="2" y="5" width="20" height="14" rx="1"></rect><path d="M2 10h20M6 15h4"></path></svg><span style="display:flex;flex-direction:column;line-height:1.25"><strong>Банковская карта</strong><span style="font-size:14px;color:#3E4B44">Visa, Mastercard, Isracard, Amex · Apple Pay, Google Pay</span></span></span>
        </button>
        <button type="button" class="choice {{bitCls}}" onClick="{{pickBit}}" style="flex:1 1 260px;align-items:center">
          <span class="radio {{bitCls}}" style="margin:0"><i></i></span>
          <span style="display:flex;align-items:center;gap:12px"><span aria-hidden="true" style="width:40px;height:30px;flex:none;border-radius:2px;background:#1F5F4A;color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;letter-spacing:.02em">bit</span><span style="display:flex;flex-direction:column;line-height:1.25"><strong>Bit</strong><span style="font-size:14px;color:#3E4B44">Через приложение на телефоне, в шекелях</span></span></span>
        </button>
      </div>

      <template data-if="{{isCard}}">
      <div style="display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-direction:column;gap:12px;border:2px dashed #C8DED3;background:#FAFBF9;border-radius:2px;padding:18px 20px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
            <span style="display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="4" y="11" width="16" height="10" rx="1"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>Защищённая форма оплаты</span>
            <span style="font-size:13px;font-weight:700;color:#6B776F;text-transform:uppercase;letter-spacing:.04em">[iframe Tranzila]</span>
          </div>
          <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px">
            <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Номер карты</span><div class="input" style="display:flex;align-items:center;color:#8A968F;font-size:20px;letter-spacing:.06em">0000 0000 0000 0000</div></div>
            <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Срок</span><div class="input" style="display:flex;align-items:center;color:#8A968F;font-size:20px">ММ / ГГ</div></div>
            <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">CVV</span><div class="input" style="display:flex;align-items:center;color:#8A968F;font-size:20px">•••</div></div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">Номер удостоверения личности (ת.ז.) — для карт израильских банков</span><div class="input" style="display:flex;align-items:center;color:#8A968F;font-size:18px">000000000</div></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <span style="display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:2px;background:#1C2620;color:#fff;font-weight:700;font-size:16px">Apple Pay</span>
            <span style="display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border-radius:2px;background:#fff;border:2px solid #1C2620;font-weight:700;font-size:16px">Google Pay</span>
          </div>
        </div>
        <div style="display:flex;gap:10px;align-items:flex-start;font-size:15px;color:#3E4B44"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><rect x="4" y="11" width="16" height="10" rx="1"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg><span>Данные карты вводятся в защищённой форме платёжной системы Tranzila прямо на этой странице — мы их не видим и не храним. Банк может попросить подтвердить оплату кодом из SMS.</span></div>
      </div>
      </template>

      <template data-if="{{isBit}}">
      <div style="display:flex;flex-direction:column;gap:14px">
        <template data-if="{{bitOk}}">
        <div style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;border:2px solid #C8DED3;background:#EEF5F1;border-radius:2px;padding:18px 20px">
          <div aria-label="QR-код для оплаты в Bit" style="width:150px;height:150px;flex:none;background:#fff;border:1px solid #CFC9BB;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#6B776F;text-align:center;padding:10px">[QR-код Bit]</div>
          <div style="display:flex;flex-direction:column;gap:8px;flex:1 1 300px">
            <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><strong style="font-size:22px">К оплате в Bit: <span style="white-space:nowrap">{{bitIls}}</span></strong><span style="font-size:15px;color:#3E4B44;white-space:nowrap">= {{amount}}</span></div>
            <div style="font-size:16px;line-height:1.5"><strong>С компьютера:</strong> откройте Bit на телефоне и наведите камеру на QR-код.<br><strong>С телефона:</strong> нажмите зелёную кнопку внизу — откроется приложение Bit.</div>
            <div style="font-size:14px;color:#3E4B44">Код действует 9 минут. После оплаты страница сама перейдёт к подтверждению заказа.</div>
          </div>
        </div>
        </template>
        <template data-if="{{bitTooBig}}">
        <div style="display:flex;gap:12px;align-items:flex-start;background:#FFF1D6;border-radius:2px;padding:14px 18px;font-size:16px;color:#1C2620"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none;margin-top:2px"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg><span>Bit принимает платежи до 5&nbsp;000&nbsp;₪. Через Bit можно оплатить <strong>аванс</strong>; для оплаты всей суммы выберите карту.</span></div>
        </template>
        <div style="font-size:14px;color:#6B776F">Сумма пересчитана в шекели по курсу [КУРС] на сегодня. Цены в заказе остаются в евро.</div>
      </div>
      </template>

      <div style="font-size:15px;color:#3E4B44;border-top:1px solid #E3DED2;padding-top:12px">Нужен банковский перевод (например, оплачивает организация)? <a href="tel:+37060000000" style="font-weight:700">Позвоните нам</a> — пришлём счёт.</div>
    </section>

    <!-- Rules summary -->
    <section class="card" style="padding:26px 28px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
        <h2 style="font-size:24px">Если планы изменятся</h2>
        <a href="rules.html" style="font-weight:700;font-size:16px">Полные условия бронирования →</a>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="rule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m5 12 5 5L20 7"></path></svg><span><b>За [N] и более дней</b> до заезда — отмена бесплатно, аванс возвращаем полностью.</span></div>
        <div class="rule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m5 12 5 5L20 7"></path></svg><span><b>Перенос дат</b> — бесплатно, если в санатории есть места.</span></div>
        <div class="rule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#C9893A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v5M12 16h.01"></path></svg><span><b>Менее чем за [N] дней</b> — аванс не возвращается, остальная сумма не взимается.</span></div>
        <div class="rule"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1F5F4A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="m5 12 5 5L20 7"></path></svg><span><b>По болезни</b> — с медицинской справкой возвращаем аванс полностью в любой срок.</span></div>
      </div>
      <label class="chk" style="padding:14px 16px;border:2px solid #CFC9BB;border-radius:2px;margin-top:4px">
        <input type="checkbox">
        <span>Я ознакомился с <a href="rules.html">условиями бронирования и отмены</a> и согласен на обработку персональных данных гостей для оформления заказа.</span>
      </label>
    </section>

    <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:8px">
      <a class="btn btn-secondary" href="guests.html">← Назад к гостям</a>
      <a class="btn btn-primary" href="done.html" style="min-height:68px;font-size:22px;padding:0 44px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        {{payLabel}}
      </a>
    </div>
  </form>

  <aside class="card" style="flex:1 1 300px;max-width:360px;padding:0;overflow:hidden;position:sticky;top:16px">
    <img src="assets/1efd1efc34d4137ff98a8658a068afc5.jpg" alt="" style="width:100%;height:160px;object-fit:cover;display:block">
    <div style="padding:20px 22px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:2px">
        <div style="font-weight:800;font-size:20px">Санаторий Эгле Комфорт</div>
        <div style="font-size:16px;color:#3E4B44">Друскининкай · ★★★★</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;font-size:16px;border-top:1px solid #E3DED2;padding-top:12px">
        <div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#3E4B44">Даты</span><strong>9–18 ноября · 9 ночей</strong></div>
        <div style="display:flex;justify-content:space-between;gap:12px"><span style="color:#3E4B44">Номер</span><strong>Двухместный</strong></div>

<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: 'adv', method: 'card' };
  }
  renderVals() {
    return { ...this._rv(), ...this.helpVals() };
  }
  // ---- Support pop-up: same on every page; dates/destination prefilled from the page when known ----
  helpVals() {
    const st = this.state || {};
    const CTX = { hotel: 'Санаторий Эгле Комфорт, Друскининкай', in: '2026-11-09', out: '2026-11-18' };
    const iso = d => d.toISOString().slice(0, 10);
    let hin = st.in || st.checkin || CTX.in || '', hout = st.out || CTX.out || '';
    if (!st.out && st.checkin) { const d = new Date(st.checkin + 'T00:00:00Z'); hout = iso(new Date(d.getTime() + (st.nights || 9) * 86400000)); }
    const DEST = [['', 'Ещё не знаю — подскажите'], ['druskininkai', 'Друскининкай'], ['birstonas', 'Бирштонас'], ['palanga', 'Паланга'], ['anyksciai', 'Аникщяй']];
    if (CTX.hotel) DEST.splice(2, 0, ['hotel', CTX.hotel]);
    const sel = CTX.hotel ? 'hotel' : (CTX.dest || '');
    const hs = st.help || 'closed';
    return {
      helpOpen: hs !== 'closed', helpForm: hs === 'form', helpSent: hs === 'sent',
      helpOpenFn: () => this.setState({ help: 'form' }), helpCloseFn: () => this.setState({ help: 'closed' }), helpSendFn: () => this.setState({ help: 'sent' }),
      helpIn: hin, helpOut: hout, helpPrefilled: !!(hin || sel),
      helpDests: DEST.map(([v, t]) => ({ v, t, sel: v === sel })),
      helpBottom: CTX.bottom || '24px'
    };
  }
  _rv() {
    const plan = this.state.plan ?? 'adv';
    const method = this.state.method ?? 'card';
    const adv = plan === 'adv';
    // Минимальный аванс — 4 % от суммы бронирования (проживание и программа), округляем вверх до евро
    const TOTAL = 2138, ADV_RATE = 0.04, ILS = 3.85;
    const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00a0');
    const advN = Math.ceil(TOTAL * ADV_RATE), restN = TOTAL - advN;
    const advAmt = fmt(advN), restAmt = fmt(restN), totalAmt = fmt(TOTAL);
    const amount = adv ? advAmt + '\u00a0€' : totalAmt + '\u00a0€';
    return {
      advAmt, restAmt, totalAmt,
      advCls: adv ? 'on' : '', fullCls: adv ? '' : 'on',
      pickAdv: () => this.setState({ plan: 'adv' }),
      pickFull: () => this.setState({ plan: 'full' }),
      isCard: method === 'card', isBit: method === 'bit',
      cardCls: method === 'card' ? 'on' : '', bitCls: method === 'bit' ? 'on' : '',
      pickCard: () => this.setState({ method: 'card' }),
      pickBit: () => this.setState({ method: 'bit' }),
      // Bit: ILS only, up to 5 000 ₪ per payment [КУРС EUR→ILS — из платёжной системы]
      bitIls: fmt(Math.round((adv ? advN : TOTAL) * ILS)) + '\u00a0₪',
      bitOk: (adv ? advN : TOTAL) * ILS <= 5000, bitTooBig: (adv ? advN : TOTAL) * ILS > 5000,
      amount,
      schedule: adv
        ? 'График: ' + advAmt + '\u00a0€ — сегодня, 27 октября. ' + restAmt + '\u00a0€ — при заезде 9 ноября в санатории.'
        : 'График: ' + totalAmt + '\u00a0€ — сегодня, 27 октября. На месте доплачивать ничего не нужно.',
      rest: adv ? 'Остаток ' + restAmt + '\u00a0€ — в санатории при заезде' : 'На месте ничего доплачивать не нужно',
      payLabel: method === 'bit' && (adv ? advN : TOTAL) * ILS <= 5000 ? 'Оплатить в Bit ' + fmt(Math.round((adv ? advN : TOTAL) * ILS)) + '\u00a0₪' : adv ? 'Оплатить аванс ' + advAmt + '\u00a0€' : 'Оплатить ' + totalAmt + '\u00a0€'
    };
  }
}
DC.mount(Component);
</script>
